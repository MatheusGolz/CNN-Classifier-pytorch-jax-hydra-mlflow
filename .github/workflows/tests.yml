# Runs the unit tests on every push and pull request (CPU only, no dataset download).
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The CPU-only PyTorch build is much smaller to download than the CUDA one.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q
